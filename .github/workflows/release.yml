name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY: bomly-plugin-syft-detector

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            git fetch --tags --force
            tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          fi
          if [[ -z "${tag}" ]]; then
            echo "No release tag found at HEAD" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            echo "${files}"
            exit 1
          fi
          python -m json.tool bomly-plugin.json >/dev/null
          go test ./...
          go vet ./...
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Create release notes
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > RELEASE_NOTES.md <<NOTES
          ${BINARY} ${TAG}

          Assets include Bomly plugin archives for Linux, macOS, and Windows plus SHA256 checksums.
          NOTES

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "${BINARY} ${TAG}" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Build plugin archives
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          repo_root="${PWD}"
          mkdir -p dist

          build_archive() {
            local goos="$1"
            local goarch="$2"
            local ext=""
            local archive_ext="tar.gz"
            if [[ "${goos}" == "windows" ]]; then
              ext=".exe"
              archive_ext="zip"
            fi

            local stage_dir
            stage_dir="$(mktemp -d)"
            mkdir -p "${stage_dir}/bin"

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w" \
              -o "${stage_dir}/bin/${BINARY}${ext}" \
              "./cmd/${BINARY}"

            cp bomly-plugin.json README.md NOTICE "${stage_dir}/"

            local archive_path="dist/${BINARY}_${TAG}_${goos}_${goarch}.${archive_ext}"
            if [[ "${archive_ext}" == "zip" ]]; then
              (
                cd "${stage_dir}"
                zip -qr "${repo_root}/${archive_path}" bomly-plugin.json README.md NOTICE bin
              )
            else
              tar -C "${stage_dir}" -czf "${archive_path}" bomly-plugin.json README.md NOTICE bin
            fi

            rm -rf "${stage_dir}"
          }

          build_archive linux amd64
          build_archive linux arm64
          build_archive darwin amd64
          build_archive darwin arm64
          build_archive windows amd64

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 |
              sort -z |
              xargs -0 sha256sum |
              sed 's#  \./#  #'
          ) > dist/SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "${TAG}" dist/* --clobber
